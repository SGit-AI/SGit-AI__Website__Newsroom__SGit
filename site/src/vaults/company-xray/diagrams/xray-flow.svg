<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <style>
    .bg{fill:#fbfaf7}
    .t{font:600 14.5px/1 system-ui,-apple-system,Segoe UI,sans-serif;fill:#101114;text-anchor:middle}
    .tl{font:600 14.5px/1 system-ui,-apple-system,Segoe UI,sans-serif;fill:#101114}
    .s{font:12.5px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;fill:#5b6170;text-anchor:middle}
    .sl{font:12.5px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;fill:#5b6170}
    .h{font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8b909c;letter-spacing:.12em;text-anchor:middle}
    .hl{font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8b909c;letter-spacing:.12em}
    .m{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2f6fed;text-anchor:middle}
    .r{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b4243a;text-anchor:middle}
    .g{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c7c43;text-anchor:middle}
    .v{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6a3fc1;text-anchor:middle}
    .p{font:700 26px/1 Georgia,serif;fill:#101114;text-anchor:middle}
    .box{fill:#fff;stroke:#c9ccd3;stroke-width:1.4;rx:10}
    .bad{fill:#fff;stroke:#b4243a;stroke-width:1.6;stroke-dasharray:5 4;rx:10}
    .good{fill:#eef7f0;stroke:#1c7c43;stroke-width:2;rx:10}
    .key{fill:#eaf0ff;stroke:#2f6fed;stroke-width:2.4;rx:10}
    .vio{fill:#f2edfc;stroke:#6a3fc1;stroke-width:2;rx:10}
    .an{stroke:#6b7080;stroke-width:1.8;fill:none}
    .life{stroke:#c9ccd3;stroke-width:1.4;stroke-dasharray:4 5}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text x="600" y="34" class="h">COMPANY X-RAY: YOUR DOCUMENTS IN, AN X-RAY AND A CLAUDE SETUP OUT</text>

  <rect class="box" x="24" y="70" width="196" height="150"/>
  <text x="122" y="100" class="t">Your documents</text>
  <text x="122" y="126" class="s">accounts, customers,</text><text x="122" y="144" class="s">complaints, minutes, the plan,</text><text x="122" y="162" class="s">suppliers, tools, prices</text>
  <text x="122" y="198" class="m">you choose, file by file</text>

  <rect class="key" x="262" y="70" width="196" height="150"/>
  <text x="360" y="100" class="t">The vault: your inbox</text>
  <text x="360" y="126" class="s">encrypted on your device;</text><text x="360" y="144" class="s">the host holds ciphertext</text><text x="360" y="162" class="s">only, with the history</text>
  <text x="360" y="198" class="m">one vault per company</text>

  <rect class="box" x="500" y="70" width="196" height="150"/>
  <text x="598" y="100" class="t">The agents</text>
  <text x="598" y="126" class="s">twelve analyses; arithmetic</text><text x="598" y="144" class="s">written as a script first;</text><text x="598" y="162" class="s">every finding tied to its file</text>
  <text x="598" y="198" class="m">Claude or ChatGPT</text>

  <rect class="good" x="738" y="70" width="196" height="150"/>
  <text x="836" y="100" class="t">A person reviews</text>
  <text x="836" y="126" class="s">every figure re-run; every</text><text x="836" y="144" class="s">inferred finding read against</text><text x="836" y="162" class="s">its evidence; a review note</text>
  <text x="836" y="198" class="g">the part that is sold</text>

  <rect class="key" x="976" y="70" width="200" height="150"/>
  <text x="1076" y="100" class="t">The vault: the X-ray</text>
  <text x="1076" y="126" class="s">delivered into the same</text><text x="1076" y="144" class="s">vault the documents went</text><text x="1076" y="162" class="s">into; nothing sent elsewhere</text>
  <text x="1076" y="198" class="m">done is a commit</text>

  <path d="M222 145 L254 145" class="an"/><path d="M247 139 L255 145 L247 151" class="an"/>
  <path d="M460 145 L492 145" class="an"/><path d="M485 139 L493 145 L485 151" class="an"/>
  <path d="M698 145 L730 145" class="an"/><path d="M723 139 L731 145 L723 151" class="an"/>
  <path d="M936 145 L968 145" class="an"/><path d="M961 139 L969 145 L961 151" class="an"/>

  <path d="M1030 222 L1030 262 L880 262 L880 290" class="an"/><path d="M874 283 L880 291 L886 283" class="an"/>
  <path d="M1110 222 L1110 290" class="an"/><path d="M1104 283 L1110 291 L1116 283" class="an"/>

  <rect class="box" x="762" y="296" width="236" height="140"/>
  <text x="880" y="326" class="t">The X-ray and a board pack</text>
  <text x="880" y="352" class="s">your three questions first;</text><text x="880" y="370" class="s">findings labelled read, computed</text><text x="880" y="388" class="s">or inferred; ninety days</text>
  <text x="880" y="418" class="m">14 findings in the sample</text>

  <rect class="vio" x="1012" y="296" width="164" height="140"/>
  <text x="1094" y="326" class="t">A Claude Project</text>
  <text x="1094" y="352" class="s">instructions, files</text><text x="1094" y="370" class="s">and first questions:</text><text x="1094" y="388" class="s">keep asking after</text>
  <text x="1094" y="418" class="v">ChatGPT works too</text>

  <rect class="bad" x="24" y="296" width="434" height="140"/>
  <text x="44" y="326" class="tl">Not in the picture, on purpose</text>
  <text x="44" y="352" class="sl">No connectors, no integrations, no logins, and no access to</text>
  <text x="44" y="370" class="sl">your accounting system, mail or drive. Nothing to review for</text>
  <text x="44" y="388" class="sl">access, so the sale can close the same day it is agreed.</text>
  <text x="44" y="418" class="hl" style="fill:#b4243a">WHAT YOU DO NOT SEND STAYS WITH YOU</text>

  <rect class="box" x="500" y="296" width="236" height="140"/>
  <text x="618" y="326" class="t">Your time</text>
  <text x="618" y="352" class="s">an hour to drop documents in;</text><text x="618" y="370" class="s">30 minutes at the handover;</text><text x="618" y="388" class="s">two hours at the Tailored level</text>
  <text x="618" y="418" class="m">five working days</text>

  <path d="M60 520 L1140 520" class="life"/>
  <g>
    <circle cx="90" cy="520" r="7" fill="#2f6fed"/><text x="90" y="548" class="t">Day 0</text><text x="90" y="568" class="s">buy; the key</text><text x="90" y="585" class="s">arrives separately</text>
    <circle cx="330" cy="520" r="7" fill="#2f6fed"/><text x="330" y="548" class="t">Day 1</text><text x="330" y="568" class="s">documents dropped in,</text><text x="330" y="585" class="s">with three questions</text>
    <circle cx="590" cy="520" r="7" fill="#2f6fed"/><text x="590" y="548" class="t">Days 2 to 4</text><text x="590" y="568" class="s">agents run, a person</text><text x="590" y="585" class="s">reviews, recompute passes</text>
    <circle cx="850" cy="520" r="7" fill="#1c7c43"/><text x="850" y="548" class="t">Day 5</text><text x="850" y="568" class="s">handover call; the X-ray</text><text x="850" y="585" class="s">is a commit in your history</text>
    <circle cx="1100" cy="520" r="7" fill="#6a3fc1"/><text x="1100" y="548" class="t">Next quarter</text><text x="1100" y="568" class="s">Re-X-ray in the same</text><text x="1100" y="585" class="s">vault: what moved</text>
  </g>
  <text x="600" y="492" class="h">FIVE WORKING DAYS, AND THEN AGAIN WHEN THE NUMBERS MOVE</text>
</svg>
