<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
    <style>
    .bg{fill:#fbfaf7}
    .t{font:600 14.5px/1 system-ui,-apple-system,Segoe UI,sans-serif;fill:#101114;text-anchor:middle}
    .s{font:12.5px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;fill:#5b6170;text-anchor:middle}
    .h{font:600 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8b909c;letter-spacing:.12em;text-anchor:middle}
    .m{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2f6fed;text-anchor:middle}
    .r{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b4243a;text-anchor:middle}
    .g{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c7c43;text-anchor:middle}
    .box{fill:#fff;stroke:#c9ccd3;stroke-width:1.4;rx:10}
    .bad{fill:#fff;stroke:#b4243a;stroke-width:1.6;stroke-dasharray:5 4;rx:10}
    .good{fill:#eef7f0;stroke:#1c7c43;stroke-width:2;rx:10}
    .gap{fill:#eef7f0;stroke:#1c7c43;stroke-width:2;stroke-dasharray:7 5;rx:10}
    .key{fill:#eaf0ff;stroke:#2f6fed;stroke-width:2.4;rx:10}
    .ab{stroke:#b4243a;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .ag{stroke:#1c7c43;stroke-width:2.2;fill:none}
    .an{stroke:#6b7080;stroke-width:1.8;fill:none}
    .akey{stroke:#2f6fed;stroke-width:2.4;fill:none}
    .life{stroke:#c9ccd3;stroke-width:1.4;stroke-dasharray:4 5}
    .mask{fill:#fbfaf7}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text x="600" y="32" class="h">ACCEPTED IS NOT ACCEPTABLE: TWO QUESTIONS, FOUR STATES</text>
  <text x="600" y="74" class="t">Accepted: an act, by a named person, at a dated moment, for an interval.</text>
  <text x="600" y="98" class="s">Acceptable: a threshold, where the business is content to stop funding remediation.</text>

  <text x="470" y="146" class="h">ACCEPTED</text><text x="880" y="146" class="h">NOT ACCEPTED</text>
  <text x="170" y="245" class="h">ABOVE THE LINE</text><text x="170" y="265" class="s">not yet acceptable</text>
  <text x="170" y="415" class="h">BELOW THE LINE</text><text x="170" y="435" class="s">acceptable</text>

  <rect class="key" x="290" y="170" width="360" height="150"/>
  <text x="470" y="206" class="t">Owned, and being worked</text>
  <text x="470" y="232" class="s">somebody signed for it, for a short interval,</text>
  <text x="470" y="252" class="s">and the interval is funding the fix</text>
  <text x="470" y="290" class="m">accept, fund or fix, with a clock</text>

  <rect class="bad" x="690" y="170" width="380" height="150"/>
  <text x="880" y="206" class="t">The dangerous one</text>
  <text x="880" y="232" class="s">over the line, and nobody has signed for it;</text>
  <text x="880" y="252" class="s">it rests on whoever is nearest and rolls up</text>
  <text x="880" y="290" class="r">unaccepted is critical</text>

  <rect class="good" x="290" y="340" width="360" height="150"/>
  <text x="470" y="376" class="t">The steady state</text>
  <text x="470" y="402" class="s">within appetite, and still signed for,</text>
  <text x="470" y="422" class="s">by a named person, for a longer interval</text>
  <text x="470" y="460" class="g">recorded, dated, owned</text>

  <rect class="box" x="690" y="340" width="380" height="150"/>
  <text x="880" y="376" class="t">Fine, and unrecorded</text>
  <text x="880" y="402" class="s">probably harmless today, and it is</text>
  <text x="880" y="422" class="s">where a register quietly goes stale</text>
  <text x="880" y="460" class="m">the drift nobody notices</text>

  <text x="600" y="540" class="t">The EU AI Act asks for residual risk to be "judged to be acceptable". It never defines acceptable.</text>
  <text x="600" y="566" class="s">Article 9(5), for providers of high-risk AI systems. The judgement is imposed; the line is yours to draw, and to show you drew.</text>
  <text x="600" y="600" class="s">Most registers only record the bottom left, at review time. The method records the left column continuously, and chases the right.</text>
</svg>
